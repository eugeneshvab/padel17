<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Padel Americano · 17.10</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#111;--mut:#6b6b6b;--line:#ddd;--acc:#e4572e;--acc2:#fde8e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#bbb}
.timer{display:flex;align-items:center;gap:8px;margin-top:6px}
.clock{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;letter-spacing:-.02em;flex:1}
.clock.end{color:var(--acc)}
.tb{min-width:56px;height:48px;border-radius:12px;background:#2a2a2a;color:#fff;font-weight:600;padding:0 12px}
.tb.go{background:var(--acc)}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:60px;font-size:13px;padding:0 2px;font-weight:600;color:var(--mut)}
nav.tabs button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.rnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rnav button{width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:700}
.rnav button:disabled{opacity:.3}
.rnav .lbl{flex:1;text-align:center}
.rnav .lbl b{display:block;font-size:22px}
.rnav .lbl span{color:var(--mut);font-size:14px}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:14px 2px 6px;font-weight:700}
.court{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 8px;margin-bottom:10px}
.court h3{margin:0 0 6px;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.court h3 .ok{color:var(--acc)}
.pair{display:flex;align-items:center;gap:8px;padding:6px 0}
.pair+.pair{border-top:1px dashed var(--line)}
.names{flex:1;font-weight:600;font-size:17px;line-height:1.2}
.names small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.pair.win .names{color:var(--acc)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:46px;height:46px;border-radius:12px;background:#efefed;font-size:24px;font-weight:700}
.step input{width:52px;height:46px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:22px;font-weight:700;background:#fff;color:var(--ink);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sit{background:#fff;border:1px dashed #bbb;border-radius:12px;padding:10px 12px;color:var(--mut);font-size:15px;margin-bottom:6px}
.sit b{color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e6e6e3;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{height:44px;border-radius:10px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;background:#fafaf8}
td:nth-child(2),th:nth-child(2){text-align:left}
td:first-child,th:first-child{width:34px;text-align:center;color:var(--mut)}
tr+tr td{border-top:1px solid #eee}
tr.top4 td{background:var(--acc2)}
td.pts{font-weight:800;font-size:18px}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
.btn{display:block;width:100%;height:54px;border-radius:14px;background:#111;color:#fff;font-weight:700;font-size:17px;margin:8px 0}
.btn.acc{background:var(--acc)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#b00020;border:1px solid #e3b3bb}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin:10px 0}
.pod{background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;text-align:center;padding:10px 6px;font-weight:600;font-size:14px}
.pod .m{font-size:28px;font-weight:800}
.pod.p1{min-height:150px;border-color:var(--acc);background:var(--acc2)}.pod.p2{min-height:120px}.pod.p3{min-height:100px}
.edit label{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:6px}
.edit label span{width:90px;color:var(--mut);font-size:14px}
.edit input{flex:1;height:42px;border:0;font-size:17px;font-weight:600;background:transparent;color:var(--ink)}
.sched{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.sched div{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.sched div:last-child{border:0}
.sched b{width:110px;font-variant-numeric:tabular-nums}
.hide{display:none}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0}.srow+.srow{border-top:1px dashed var(--line)}
.srow.sum{font-size:17px}.srow.sum b{margin-left:6px;font-variant-numeric:tabular-nums}
.tm{height:46px;border:1px solid var(--line);border-radius:12px;font-size:20px;font-weight:700;padding:0 10px;background:#fff;color:var(--ink)}
.warn{margin:6px 0 4px;padding:8px 10px;border-radius:10px;background:var(--acc2);color:#9a3412;font-size:14px}
.x{min-width:40px;height:40px;border-radius:10px;background:#efefed;font-size:20px;font-weight:700;color:var(--mut)}
.x.add{font-size:14px;padding:0 12px;color:var(--ink)}
.btn.big{height:72px;font-size:21px;margin:6px 0 4px}
.court.q .names{color:#bbb;letter-spacing:.04em}.court.spin .names{color:var(--ink)}.court.spin{border-color:var(--acc)}
.nm{display:inline-block;min-width:3.5em}.sit .nm{min-width:0}
.pop .court,.pop .sit{animation:pop .45s ease-out both}
@keyframes pop{0%{transform:scale(.94);opacity:.2}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.rules{list-style:none;padding:0;margin:4px 0 0;counter-reset:r}
.rules li{counter-increment:r;position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 58px;margin-bottom:10px;font-size:21px;line-height:1.35;font-weight:500}
.rules li::before{content:counter(r);position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.rules h2{font-size:26px;margin:6px 2px 12px}
</style>
</head>
<body>
<header>
  <div class="top"><span class="ttl">Padel · Urodziny Daniila 13</span><span class="ttl" id="tround"></span></div>
  <div class="timer">
    <div class="clock" id="clock">--:--</div>
    <button class="tb go" id="tstart">Start</button>
    <button class="tb" id="treset" aria-label="Reset">↺</button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="round" class="on">Runda</button>
  <button data-tab="table">Tabela</button>
  <button data-tab="final">FINAŁ</button>
  <button data-tab="rules">Zasady</button>
  <button data-tab="more">Więcej</button>
</nav>
<script>
const DEF_KIDS = ["Hugo","Piotrek","Maciek","Bartek","Hubert","Staś","Dawid","Dima","Stefan","Daniil"];
const DEF_ADULTS = ["Marina","Eugene","Roman","Vika","Jana","Max","Alex","Yury","Katsiaryna","Lena"];
const BIRTHDAY = "Daniil";
const MAXR = 20, ATTEMPTS = 120;
const KEY = "padel17_v3";
const FINAL_AT = 14*60+55;

function fresh(){return {tab:"round",round:0,scores:{},names:{},board:"k",final:null,cfgSeen:false,rev:{},
  cfg:{len:10,rounds:10,start:"13:15"},roster:{k:DEF_KIDS.slice(),a:DEF_ADULTS.slice()},
  timer:{running:false,endAt:0,left:600}}}
let S; try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=fresh()}
try{if(!localStorage.getItem(KEY)){const o=JSON.parse(localStorage.getItem("padel17_v2")||"null");if(o){["cfg","cfgSeen","names","roster"].forEach(k=>{if(o[k]!==undefined)S[k]=o[k]})}}localStorage.removeItem("padel17_v2_draw")}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const N = id => S.names[id] || id;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = m => String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const toMin = s => {const [h,m]=String(s).split(":").map(Number);return (h||0)*60+(m||0)};
const RS = () => S.cfg.len*60;

// ---------- live draw engine: real randomness + lookahead over remaining planned rounds ----------
function rand32(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]}catch(e){return Math.floor(Math.random()*4294967296)}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const STRUCTS={};
function structs(k){ // all ways to split 4k slots into k matches of 2v2
  if(STRUCTS[k])return STRUCTS[k];
  const pm=[];(function rec(rest,acc){if(!rest.length){pm.push(acc);return}const a=rest[0];for(let i=1;i<rest.length;i++){rec(rest.filter((_,j)=>j!==0&&j!==i),acc.concat([[a,rest[i]]]))}})([...Array(4*k).keys()],[]);
  const out=[];
  for(const pairs of pm){(function rec(rest,acc){if(!rest.length){out.push(acc);return}for(let i=1;i<rest.length;i++){rec(rest.filter((_,j)=>j!==0&&j!==i),acc.concat([[rest[0],rest[i]]]))}})(pairs,[])}
  return STRUCTS[k]=out;
}
// history from revealed rounds (array of {matches,sit} for this group); players no longer in roster are ignored;
// "sat out" = did not play in that round (so a newly added player counts as having sat out earlier rounds)
function histOf(players,rounds){
  const n=players.length, idx=new Map(players.map((p,i)=>[p,i]));
  const P=Array.from({length:n},()=>new Array(n).fill(0)), O=Array.from({length:n},()=>new Array(n).fill(0)), sit=new Array(n).fill(0);
  let last=new Array(n).fill(false);
  for(const g of rounds){const playing=new Array(n).fill(false);
    for(const [A,B] of g.matches){const a=A.map(p=>idx.get(p)).filter(i=>i!==undefined), b=B.map(p=>idx.get(p)).filter(i=>i!==undefined);
      [...a,...b].forEach(i=>playing[i]=true);
      if(a.length===2){P[a[0]][a[1]]++;P[a[1]][a[0]]++} if(b.length===2){P[b[0]][b[1]]++;P[b[1]][b[0]]++}
      a.forEach(x=>b.forEach(y=>{O[x][y]++;O[y][x]++}))}
    last=playing.map(p=>!p); last.forEach((s,i)=>{if(s)sit[i]++});
  }
  return {P,O,sit,last};
}
function cloneH(H){return {P:H.P.map(r=>r.slice()),O:H.O.map(r=>r.slice()),sit:H.sit.slice(),last:H.last.slice()}}
function step(n,c,sitN,ST,H,R){
  const ord=[...Array(n).keys()].map(i=>[i,R()]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);
  ord.sort((x,y)=>(H.sit[x]-H.sit[y])||((H.last[x]?1:0)-(H.last[y]?1:0)));
  const sit=ord.slice(0,sitN), play=ord.slice(sitN);
  let bc=Infinity, ties=[];
  for(const s of ST){let cost=0;
    for(const [p1,p2] of s){const a=play[p1[0]],b=play[p1[1]],x=play[p2[0]],y=play[p2[1]];
      cost+=1000*(H.P[a][b]+H.P[x][y])+(H.O[a][x]+H.O[a][y]+H.O[b][x]+H.O[b][y]);if(cost>bc)break}
    if(cost<bc){bc=cost;ties=[s]}else if(cost===bc)ties.push(s)}
  const bs=ties[Math.floor(R()*ties.length)];
  const ms=bs.map(([p1,p2])=>[[play[p1[0]],play[p1[1]]],[play[p2[0]],play[p2[1]]]]);
  let pr=0,orp=0,b2b=0;
  ms.forEach(([A,B])=>{pr+=H.P[A[0]][A[1]]+H.P[B[0]][B[1]];A.forEach(a=>B.forEach(b=>orp+=H.O[a][b]));
    H.P[A[0]][A[1]]++;H.P[A[1]][A[0]]++;H.P[B[0]][B[1]]++;H.P[B[1]][B[0]]++;A.forEach(a=>B.forEach(b=>{H.O[a][b]++;H.O[b][a]++}))});
  const last=new Array(n).fill(false); sit.forEach(i=>{if(H.last[i])b2b++;H.sit[i]++;last[i]=true}); H.last=last;
  return {ms,sit,pr,orp,b2b};
}
// returns next round {matches,sit} in names; remaining = planned rounds left incl. this one
function drawNext(players,rounds,remaining,opt){
  opt=opt||{};const ms=opt.ms||200, maxA=opt.maxAttempts||5000, minA=opt.minAttempts||30;
  const n=players.length, c=Math.min(2,Math.floor(n/4)), sitN=n-4*c;
  if(c===0)return {matches:[],sit:players.slice()};
  const ST=structs(c), H0=histOf(players,rounds), t0=Date.now(), R=rng(rand32());
  let best=null,bestScore=Infinity,att=0;
  while(att<maxA&&(att<minA||Date.now()-t0<ms)){
    att++;const H=cloneH(H0);let score=0,first=null;
    for(let k=0;k<Math.max(1,remaining);k++){const s=step(n,c,sitN,ST,H,R);if(!first)first=s;
      score+=1e6*s.pr+1e3*s.b2b+s.orp; if(score>bestScore)break}
    if(score<bestScore||(score===bestScore&&R()<0.5)){bestScore=score;best=first}
  }
  return {matches:best.ms.map(([A,B])=>[A.map(i=>players[i]),B.map(i=>players[i])]),sit:best.sit.map(i=>players[i]),_att:att};
}
const ROUNDS=()=>S.cfg.rounds;
const groupRounds=(g,upto)=>{const out=[];for(let r=0;r<upto&&S.rev[r];r++)out.push(S.rev[r][g]);return out};
function revealedCount(){let r=0;while(S.rev[r])r++;return r}

function roundMatches(r){
  const out=[],R=S.rev[r]; if(!R)return out; const kc=R.k.matches.length;
  R.k.matches.forEach((m,i)=>out.push({id:`k${r}_${i}`,court:i+1,a:m[0],b:m[1],grp:"k"}));
  R.a.matches.forEach((m,i)=>out.push({id:`a${r}_${i}`,court:kc+i+1,a:m[0],b:m[1],grp:"a"}));
  out.forEach(m=>m.sig=m.a.join(",")+"|"+m.b.join(","));
  return out;
}
function getScore(id,sig){const s=S.scores[id];if(!s||(sig&&s.g!==sig))return [null,null];return s.s}
function done(s){return s[0]!==null&&s[1]!==null}
function hasScores(){return Object.keys(S.scores).length>0}

function standings(grp){
  const t={};S.roster[grp].forEach(p=>t[p]={p,pts:0,w:0,g:0});
  for(let r=0;r<ROUNDS();r++) roundMatches(r).filter(m=>m.grp===grp).forEach(m=>{
    const s=getScore(m.id,m.sig); if(!done(s))return; const a=+s[0],b=+s[1];
    m.a.forEach(p=>{if(!t[p])return;t[p].pts+=a;t[p].g++;if(a>b)t[p].w++});
    m.b.forEach(p=>{if(!t[p])return;t[p].pts+=b;t[p].g++;if(b>a)t[p].w++});
  });
  const L=Object.values(t);L.forEach(x=>x.avg=x.g?x.pts/x.g:0);
  return L.sort((x,y)=>y.avg-x.avg||y.pts-x.pts||y.w-x.w||N(x.p).localeCompare(N(y.p),"pl"));
}

function stepper(key,val,extra){
  return `<div class="step"><button data-st="${key}|-1" aria-label="minus">−</button><input inputmode="numeric" pattern="[0-9]*" type="number" min="0" data-in="${key}" value="${val===null?"":val}" placeholder="–" ${extra||""}><button data-st="${key}|1" aria-label="plus">+</button></div>`;
}
let MS={}; // match registry for score inputs
function pairRow(m,side,s){
  const me=s[side],ot=s[1-side],win=done(s)&&+me>+ot,pl=side?m.b:m.a;
  return `<div class="pair${win?" win":""}"><div class="names">${pl.map(p=>esc(N(p))).join(" + ")}</div>${stepper(m.id+"|"+side,me)}</div>`;
}
function courtCard(m,title){
  MS[m.id]=m; const s=getScore(m.id,m.sig);
  return `<div class="court"><h3><span>${title}</span>${done(s)?'<span class="ok">✓ zapisane</span>':""}</h3>${pairRow(m,0,s)}${pairRow(m,1,s)}</div>`;
}
function times(r){const st=toMin(S.cfg.start)+r*S.cfg.len;return hm(st)+"–"+hm(st+S.cfg.len)}

function vSettings(first){
  const P=S._pend||(S._pend=Object.assign({},S.cfg)), st=toMin(P.start), end=st+P.rounds*P.len;
  let h=`<div class="sec">${first?"Ustawienia turnieju":"Ustawienia rund"}</div><div class="court set">
  <div class="srow"><div class="names">Długość rundy<small>minuty (3–30)</small></div>${stepper("cfg|len",P.len,'data-min="3" data-max="30"')}</div>
  <div class="srow"><div class="names">Liczba rund<small>1–20</small></div>${stepper("cfg|rounds",P.rounds,'data-min="1" data-max="20"')}</div>
  <div class="srow"><div class="names">Start rund</div><input type="time" class="tm" data-cfgstart value="${esc(P.start)}"></div>
  <div class="srow sum">Rundy: <b>${hm(st)}–${hm(end)}</b></div>
  ${end>FINAL_AT?`<p class="warn">Rundy kończą się po 14:55 – finał i tort mogą się nie zmieścić przed 16:00.</p>`:`<p class="note">Zostaje czas na finał (14:55–15:20) i tort.</p>`}
  </div><button class="btn acc" id="cfgsave">${first?"Zaczynamy":"Zapisz ustawienia"}</button>`;
  return h;
}
let ANIM=null;
function roundHasScores(r){return Object.keys(S.scores).some(k=>k.startsWith("k"+r+"_")||k.startsWith("a"+r+"_"))}
function reveal(r){
  if(ANIM||S.rev[r]||(r>0&&!S.rev[r-1]))return;
  ANIM={r,res:null,t0:Date.now()};render();
  const iv=setInterval(()=>document.querySelectorAll(".nm").forEach(el=>{const L=S.roster[el.dataset.g];el.textContent=N(L[Math.floor(Math.random()*L.length)])}),80);
  setTimeout(()=>{const left=Math.max(1,ROUNDS()-r);
    ANIM.res={k:drawNext(S.roster.k,groupRounds("k",r),left,{ms:200}),a:drawNext(S.roster.a,groupRounds("a",r),left,{ms:200})};
    window.__lastAtt=[ANIM.res.k._att,ANIM.res.a._att];delete ANIM.res.k._att;delete ANIM.res.a._att},120);
  (function fin(){if(!ANIM.res||Date.now()-ANIM.t0<1800){setTimeout(fin,50);return}
    clearInterval(iv);S.rev[r]=ANIM.res;ANIM=null;S._just=r;save();render();delete S._just;if(navigator.vibrate)navigator.vibrate(80)})();
}
function vRound(){
  if(!S.cfgSeen) return vSettings(true);
  if(S.round>=ROUNDS())S.round=ROUNDS()-1;
  const r=S.round, R=S.rev[r], ms=roundMatches(r);
  let h=`<div class="rnav"><button id="prev" ${r===0?"disabled":""}>‹</button><div class="lbl"><b>Runda ${r+1} / ${ROUNDS()}</b><span>${times(r)}</span></div><button id="next" ${r===ROUNDS()-1?"disabled":""}>›</button></div>`;
  const cr=(a,b)=>a===b?`kort ${a}`:`korty ${a}–${b}`;
  if(!R){
    const anim=ANIM&&ANIM.r===r, nc=g=>Math.min(2,Math.floor(S.roster[g].length/4)), kc=nc("k"), ac=nc("a");
    const can=r===0||!!S.rev[r-1];
    if(!anim){
      if(can) h+=`<button class="btn acc big" id="reveal">🎲 Losuj rundę ${r+1}</button><p class="note" style="text-align:center">Pary i pauzy losujemy na żywo – niespodzianka!</p>`;
      else h+=`<p class="note">Najpierw wylosuj rundę ${revealedCount()+1}.</p><button class="btn" id="gofirst">Przejdź do rundy ${revealedCount()+1}</button>`;
    } else h+=`<p class="note" style="text-align:center;font-weight:700;color:var(--acc)">Losowanie…</p>`;
    const q=g=>anim?`<span class="nm" data-g="${g}">?</span>`:"?";
    const card=(g,c)=>`<div class="court q${anim?" spin":""}"><h3><span>Kort ${c}</span></h3><div class="pair"><div class="names">${q(g)} + ${q(g)}</div></div><div class="pair"><div class="names">${q(g)} + ${q(g)}</div></div></div>`;
    h+=`<div class="sec">Dzieci${kc?" · "+cr(1,kc):""}</div>`;for(let i=0;i<kc;i++)h+=card("k",i+1);
    if(S.roster.k.length>4*kc)h+=`<div class="sit">Pauza: <b>${Array(S.roster.k.length-4*kc).fill(0).map(()=>q("k")).join(", ")}</b></div>`;
    h+=`<div class="sec">Dorośli${ac?" · "+cr(kc+1,kc+ac):""}</div>`;for(let i=0;i<ac;i++)h+=card("a",kc+i+1);
    if(S.roster.a.length>4*ac)h+=`<div class="sit">Pauza: <b>${Array(S.roster.a.length-4*ac).fill(0).map(()=>q("a")).join(", ")}</b></div>`;
    return h;
  }
  const kc=R.k.matches.length, ac=R.a.matches.length, pop=S._just===r?" pop":"";
  h=h.replace('<div class="rnav">','<div class="rnav">');
  h+=`<div class="${pop}">`;
  h+=`<div class="sec">Dzieci${kc?" · "+cr(1,kc):""}</div>`;
  ms.filter(m=>m.grp==="k").forEach(m=>h+=courtCard(m,"Kort "+m.court));
  if(R.k.sit.length)h+=`<div class="sit">Pauza: <b>${R.k.sit.map(N).map(esc).join(", ")}</b></div>`;
  h+=`<div class="sec">Dorośli${ac?" · "+cr(kc+1,kc+ac):""}</div>`;
  ms.filter(m=>m.grp==="a").forEach(m=>h+=courtCard(m,"Kort "+m.court));
  if(R.a.sit.length)h+=`<div class="sit">Pauza: <b>${R.a.sit.map(N).map(esc).join(", ")}</b></div>`;
  h+=`</div><p class="note">Każdy gracz dostaje tyle punktów, ile zdobyła jego para. Remis = bez zwycięstwa.</p>`;
  if(!S.rev[r+1]&&!roundHasScores(r)) h+=`<button class="btn ghost" id="reroll">↻ Losuj ponownie</button>`;
  if(r<ROUNDS()-1) h+=`<button class="btn" id="next2">Następna runda ›</button>`;
  else {h+=`<button class="btn acc" data-go="final">Przejdź do FINAŁU</button>`;
    if(ROUNDS()<MAXR)h+=`<button class="btn ghost" id="addround">+ Dodaj rundę (${hm(toMin(S.cfg.start)+ROUNDS()*S.cfg.len)}–${hm(toMin(S.cfg.start)+(ROUNDS()+1)*S.cfg.len)})</button>`}
  return h;
}
function vTable(){
  const g=S.board, rows=standings(g);
  let h=`<div class="seg"><button data-board="k" class="${g==="k"?"on":""}">Dzieci</button><button data-board="a" class="${g==="a"?"on":""}">Dorośli</button></div>`;
  h+=`<table><tr><th>#</th><th>Gracz</th><th>Śr</th><th>Pkt</th><th>W</th><th>M</th></tr>`;
  rows.forEach((x,i)=>h+=`<tr class="${i<4?"top4":""}"><td>${i+1}</td><td>${esc(N(x.p))}${x.p===BIRTHDAY?" 🎂":""}</td><td class="pts">${x.avg.toFixed(1).replace(".",",")}</td><td>${x.pts}</td><td>${x.w}</td><td>${x.g}</td></tr>`);
  h+=`</table><p class="note">Śr – średnio punktów na mecz, Pkt – suma, W – wygrane, M – mecze. Kolejność wg średniej (uczciwie przy różnej liczbie meczów), potem suma i wygrane. Top 4 grają w finale.</p>`;
  return h;
}
function finalSeeds(){
  let k=standings("k").map(x=>x.p).slice(0,4);
  if(S.roster.k.includes(BIRTHDAY)&&!k.includes(BIRTHDAY)) k[Math.min(3,k.length-1)]=BIRTHDAY;
  const a=standings("a").map(x=>x.p).slice(0,4);
  return [[k[0],a[3]],[k[1],a[2]],[k[2],a[1]],[k[3],a[0]]].map(p=>p.filter(Boolean));
}
function winLose(m){const s=getScore(m.id);if(!done(s)||+s[0]===+s[1])return null;return +s[0]>+s[1]?[m.a,m.b]:[m.b,m.a]}
function vFinal(){
  let h=`<div class="sec">Finał 14:55–15:20 · pary mieszane</div>`;
  if(!S.final){
    const P=finalSeeds();
    h+=`<div class="court"><h3><span>Podgląd par wg aktualnej tabeli</span></h3>${P.map((p,i)=>`<div class="pair"><div class="names">Para ${i+1}: ${p.map(N).map(esc).join(" + ")}</div></div>`).join("")}</div>`;
    h+=`<p class="note">Dziecko 1 + Dorosły 4, D2 + Do3, D3 + Do2, D4 + Do1. Daniil zawsze gra (jako dziecko nr 4, jeśli nie jest w top 4).</p><button class="btn acc" id="mkfinal">Ustal pary finałowe</button>`;
    return h;
  }
  const P=S.final.pairs, m1={id:"f_s1",a:P[0],b:P[3]}, m2={id:"f_s2",a:P[1],b:P[2]};
  h+=`<div class="sec">Półfinały</div>`+courtCard(m1,"Kort 1 · Para 1 vs Para 4")+courtCard(m2,"Kort 2 · Para 2 vs Para 3");
  const s1=winLose(m1), s2=winLose(m2);
  if(s1&&s2){
    const mf={id:"f_f",a:s1[0],b:s2[0]}, mt={id:"f_t",a:s1[1],b:s2[1]};
    h+=`<div class="sec">Finał i mecz o 3. miejsce</div>`+courtCard(mf,"Kort 1 · Finał")+courtCard(mt,"Kort 2 · O 3. miejsce");
    const f=winLose(mf), t=winLose(mt);
    if(f&&t){const nm=p=>p.map(N).map(esc).join("<br>");
      h+=`<div class="sec">Podium · 15:20</div><div class="podium"><div class="pod p2"><div class="m">2</div>${nm(f[1])}</div><div class="pod p1"><div class="m">1</div>${nm(f[0])}</div><div class="pod p3"><div class="m">3</div>${nm(t[0])}</div></div><p class="note" style="text-align:center">Gratulacje! Teraz tort 🎂 (15:25–16:00)</p>`}
  } else h+=`<p class="note">Wpisz wyniki półfinałów (bez remisów), żeby pokazać finał.</p>`;
  h+=`<button class="btn ghost" id="rmfinal">Ustal pary od nowa</button>`;
  return h;
}
function vMore(){
  const c=S.cfg,st=toMin(c.start),end=st+c.rounds*c.len;
  let h=vSettings(false);
  h+=`<div class="sec">Plan dnia</div><div class="sched">
  <div><b>13:00–${hm(st)}</b>Rozgrzewka</div><div><b>${hm(st)}–${hm(end)}</b>${c.rounds} ${c.rounds===1?"runda":(c.rounds%10>=2&&c.rounds%10<=4&&(c.rounds<10||c.rounds>20)?"rundy":"rund")} po ${c.len} min</div><div><b>14:55–15:20</b>Finał (pary mieszane)</div><div><b>15:20–15:25</b>Nagrody</div><div><b>15:25–16:00</b>Tort 🎂</div></div>`;
  h+=`<div class="sec">Edytuj składy</div><p class="note">Zmiana imienia nie zmienia wylosowanych par. Dodanie lub usunięcie gracza działa od następnej losowanej rundy (na 1 kort potrzeba 4 graczy, reszta pauzuje).</p><div class="edit">`;
  [["Dzieci","k"],["Dorośli","a"]].forEach(([t,g])=>{h+=`<div class="sec">${t} (${S.roster[g].length})</div>`;
    S.roster[g].forEach(p=>h+=`<label><span>${esc(p)}</span><input data-nm="${esc(p)}" value="${esc(N(p))}"><button class="x" data-rm="${g}|${esc(p)}" aria-label="usuń">×</button></label>`);
    h+=`<label><input data-addname="${g}" placeholder="+ Dodaj gracza"><button class="x add" data-add="${g}">Dodaj</button></label>`});
  h+=`</div><div class="sec">Zasady</div><button class="btn ghost" data-go="rules">Zasady do przeczytania na głos ›</button>`;
  h+=`<button class="btn danger" id="reset">Wyczyść wszystkie wyniki</button>`;
  return h;
}
function plural(n,one,few,many){if(n===1)return one;const d=n%10,dd=n%100;return d>=2&&d<=4&&(dd<12||dd>14)?few:many}
function vRules(){
  const c=S.cfg,st=toMin(c.start),end=st+c.rounds*c.len;
  const L=[`Gramy ${c.rounds} ${plural(c.rounds,"rundę","rundy","rund")} po ${c.len} ${plural(c.len,"minutę","minuty","minut")}, od ${hm(st)} do ${hm(end)}. W każdej rundzie losujemy nowego partnera i nowych rywali.`,
  "Dzieci grają na kortach 1 i 2, dorośli na kortach 3 i 4.",
  "Gramy do sygnału. Każda wygrana wymiana to 1 punkt.",
  "Każdy serwuje 2 razy, potem serwuje następna osoba.",
  "Po sygnale mówimy wynik. Każdy z pary dostaje tyle punktów, ile zdobyła para.",
  "Kto pauzuje, zbiera piłki i pilnuje wyniku.",
  "Na koniec najlepsze dzieci i najlepsi dorośli tworzą mieszane pary i grają finał. Solenizant gra w finale zawsze!",
  "Potem tort! Gramy fair i dobrze się bawimy."];
  return `<h2>Zasady</h2><ol class="rules">${L.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
}
function render(){
  MS={};
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  document.getElementById("tround").textContent=S.tab==="final"?"Finał":"Runda "+(Math.min(S.round,ROUNDS()-1)+1);
  document.getElementById("main").innerHTML={round:vRound,table:vTable,final:vFinal,rules:vRules,more:vMore}[S.tab]();
}
function setScore(id,side,val){
  const m=MS[id], cur=getScore(id,m.sig).slice();
  cur[side]=(val===""||val===null||isNaN(val))?null:Math.max(0,Math.min(99,parseInt(val,10)));
  if(cur[side]!==null&&cur[1-side]===null)cur[1-side]=0;
  if(cur[0]===null&&cur[1]===null) delete S.scores[id]; else S.scores[id]={s:cur,g:m.sig};
  save();
}
function setPend(f,v,min,max){S._pend[f]=Math.max(min,Math.min(max,v||min))}
function applyCfg(){
  const P=S._pend, old=S.cfg, revN=revealedCount();
  if(P.rounds<revN){
    if(!confirm(`Rundy ${P.rounds+1}–${revN} są już wylosowane${Object.keys(S.scores).some(k=>{const m=k.match(/^[ka](\d+)_/);return m&&+m[1]>=P.rounds})?" i mają wyniki":""}. Usunąć je?`))return;
    for(let i=P.rounds;i<revN;i++)delete S.rev[i];
    Object.keys(S.scores).forEach(k=>{const m=k.match(/^[ka](\d+)_/);if(m&&+m[1]>=P.rounds)delete S.scores[k]});
  }
  S.cfg=Object.assign({},P); S.cfgSeen=true; delete S._pend;
  if(!S.timer.running){S.timer.left=RS();S.timer.endAt=0}
  save();render();tick();scrollTo(0,0);
}
function rosterChange(fn){
  if(revealedCount()&&!confirm("Zmiana składu dotyczy tylko rund jeszcze nie wylosowanych. Wylosowane rundy i wyniki zostają. Kontynuować?"))return false;
  fn();save();render();return true;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.tab){if(ANIM)return;S.tab=b.dataset.tab;delete S._pend;save();render();scrollTo(0,0);return}
  if(b.dataset.go){S.tab=b.dataset.go;save();render();scrollTo(0,0);return}
  if(b.dataset.board){S.board=b.dataset.board;save();render();return}
  if(b.dataset.st){const p=b.dataset.st.split("|"),d=+p.pop();
    if(p[0]==="cfg"){const inp=b.parentNode.querySelector("input");setPend(p[1],S._pend[p[1]]+d,+inp.dataset.min,+inp.dataset.max);render();return}
    const [id,side]=p,cur=getScore(id,MS[id].sig)[+side];setScore(id,+side,Math.max(0,(cur===null?0:+cur)+d));render();return}
  if(b.dataset.rm){const [g,p]=b.dataset.rm.split("|");rosterChange(()=>{S.roster[g]=S.roster[g].filter(x=>x!==p)});return}
  if(b.dataset.add){const inp=document.querySelector(`[data-addname="${b.dataset.add}"]`),v=inp.value.trim().slice(0,20),g=b.dataset.add;
    if(!v)return; if(S.roster.k.includes(v)||S.roster.a.includes(v)){alert("Takie imię już jest.");return}
    rosterChange(()=>{S.roster[g]=S.roster[g].concat([v])});return}
  if(b.id==="cfgsave"){applyCfg();return}
  if(b.id==="reveal"){reveal(S.round);return}
  if(b.id==="gofirst"){S.round=revealedCount();save();render();scrollTo(0,0);return}
  if(b.id==="reroll"){const r=S.round;if(ANIM||S.rev[r+1])return;if(roundHasScores(r)){alert("Ta runda ma już wyniki – nie można losować ponownie.");render();return}
    if(confirm(`Wylosować rundę ${r+1} od nowa?`)){delete S.rev[r];save();reveal(r)}return}
  if(b.id==="addround"){S.cfg.rounds=Math.min(MAXR,S.cfg.rounds+1);S.round=S.cfg.rounds-1;save();render();scrollTo(0,0);return}
  if(ANIM)return;
  if(b.id==="prev"&&S.round>0){S.round--;save();render();scrollTo(0,0)}
  if((b.id==="next"||b.id==="next2")&&S.round<ROUNDS()-1){S.round++;save();render();scrollTo(0,0)}
  if(b.id==="mkfinal"){S.final={pairs:finalSeeds()};save();render()}
  if(b.id==="rmfinal"&&confirm("Ustalić pary finałowe od nowa? Wyniki finału zostaną usunięte.")){S.final=null;["f_s1","f_s2","f_f","f_t"].forEach(k=>delete S.scores[k]);save();render()}
  if(b.id==="reset"&&confirm("Na pewno wyczyścić WSZYSTKIE wyniki i losowania?")&&confirm("To nieodwracalne. Kontynuować?")){S.scores={};S.rev={};S.final=null;S.round=0;save();render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.in){const p=t.dataset.in.split("|");
    if(p[0]==="cfg"){setPend(p[1],parseInt(t.value,10),+t.dataset.min,+t.dataset.max);render();return}
    setScore(p[0],+p[1],t.value);render()}
  if(t.dataset.cfgstart!==undefined){if(/^\d\d:\d\d$/.test(t.value)){S._pend.start=t.value;render()}}
  if(t.dataset.nm!==undefined){const v=t.value.trim();if(!v||v===t.dataset.nm)delete S.names[t.dataset.nm];else S.names[t.dataset.nm]=v.slice(0,20);save()}
});
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.in)e.target.select()});

// ---- timer ----
let actx=null, wake=null, beeped=false;
const clockEl=document.getElementById("clock"), startEl=document.getElementById("tstart");
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();const o=actx.createOscillator(),g=actx.createGain();g.gain.value=0.0001;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.02)}catch(e){}}
function beep(){
  try{if(!actx)return;const t0=actx.currentTime;
    for(let i=0;i<8;i++){const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=i%2?1320:880;
      const t=t0+i*0.32;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.28)}}catch(e){}
  if(navigator.vibrate)navigator.vibrate([400,150,400,150,800]);
}
async function wakeOn(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
function wakeOff(){try{wake&&wake.release();wake=null}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.timer.running)wakeOn()});
function leftNow(){const T=S.timer;return T.running?Math.max(0,Math.round((T.endAt-Date.now())/1000)):T.left}
function tick(){
  const l=leftNow();clockEl.textContent=String(Math.floor(l/60)).padStart(2,"0")+":"+String(l%60).padStart(2,"0");
  clockEl.classList.toggle("end",l===0);
  startEl.textContent=S.timer.running?"Pauza":(l===0||l>=RS()?"Start":"Wznów");
  startEl.classList.toggle("go",!S.timer.running);
  if(S.timer.running&&l===0){S.timer.running=false;S.timer.left=0;save();if(!beeped){beeped=true;beep()}wakeOff()}
}
startEl.onclick=()=>{unlockAudio();const T=S.timer;
  if(T.running){T.left=leftNow();T.running=false;wakeOff()}
  else{if(T.left<=0)T.left=RS();T.endAt=Date.now()+T.left*1000;T.running=true;beeped=false;wakeOn()}
  save();tick()};
document.getElementById("treset").onclick=()=>{S.timer={running:false,endAt:0,left:RS()};beeped=false;wakeOff();save();tick()};
if(!S.timer.running&&S.timer.left>RS())S.timer.left=RS();
setInterval(tick,250);tick();render();
</script>
</body>
